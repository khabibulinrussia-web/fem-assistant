<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Круг-подложка -->
  <circle cx="256" cy="256" r="160" fill="rgba(255,255,255,0.15)"/>
  <!-- Буква Ф -->
  <text x="256" y="310" font-family="Arial,Helvetica,sans-serif" font-size="240" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">Ф</text>
  <!-- Иконка графика (линии вверх-вправо) -->
  <polyline points="140,340 200,280 260,300 320,220 370,180" stroke="rgba(255,255,255,0.5)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="180" r="8" fill="#34d399"/>
  <!-- Знак рубля малый -->
  <text x="370" y="400" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="rgba(255,255,255,0.4)" text-anchor="middle">₽</text>
</svg>
